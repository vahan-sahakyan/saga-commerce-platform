version: '3.8'

services:
  postgresql:
    image: postgres:16-alpine
    container_name: saga-postgres
    environment:
      POSTGRES_USER: saga
      POSTGRES_PASSWORD: saga-password
      POSTGRES_DB: saga
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - saga-network

  redis:
    image: redis:7-alpine
    container_name: saga-redis
    command: redis-server --requirepass redis-password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - saga-network

  redpanda:
    image: redpandadata/redpanda:v24.1.1
    container_name: saga-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --schema-registry-addr
      - 0.0.0.0:8081
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
    ports:
      - "9092:9092"
      - "29092:29092"
      - "8081:8081"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info -X brokers=localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - saga-network

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: saga-redpanda-console
    environment:
      - KAFKA_BROKERS=redpanda:29092
      - SCHEMAREGISTRY_URL=http://redpanda:8081
    ports:
      - "8092:8080"
    depends_on:
      - redpanda
    networks:
      - saga-network

volumes:
  postgres_data:
  redis_data:
  redpanda_data:

networks:
  saga-network:
    driver: bridge

replicaCount: 1

image:
  repository: saga-registry:5000/notification-service
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

env:
  - name: KAFKA_BOOTSTRAP_SERVERS
    value: "redpanda.infra.svc.cluster.local:9093"
  - name: JAEGER_ENDPOINT
    value: "http://jaeger-collector.observability.svc.cluster.local:14268/api/traces"

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 5
